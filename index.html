<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="一份只給妳的禮物 ❤️">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ff6b9d">
    <meta property="og:type" content="website">
    <meta property="og:title" content="For You ❤️">
    <meta property="og:description" content="一份只給妳的禮物，點開來看看">
    <meta property="og:image" content="https://cby0730.github.io/ForMyLove/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>❤️ For You</title>
    <link rel="preload" href="style.css" as="style">
    <link rel="preload" href="vendor/gsap.min.js" as="script">
    <link rel="preload" href="content.js" as="script">
    <link rel="preload" href="ambient.js" as="script">
    <link rel="preload" href="firework.js" as="script">
    <link rel="preload" href="script.js" as="script">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" as="style">
    <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Shared heart shape: every heart on the page is a <use> of this symbol. -->
    <svg class="svg-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff6b9d" />
                <stop offset="100%" stop-color="#c23866" />
            </linearGradient>
            <symbol id="heart-shape" viewBox="0 0 32 29.6">
                <path fill="url(#heartGradient)" d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2
                c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z" />
            </symbol>
        </defs>
    </svg>
    <canvas class="ambient-canvas" aria-hidden="true"></canvas>
    <div class="night-sky" aria-hidden="true"></div>
    <div class="container">
        <div class="center-glow" aria-hidden="true"></div>
        <div class="heart-wrapper">
            <div class="heart-visual">
                <svg class="heart" viewBox="0 0 32 29.6" xmlns="http://www.w3.org/2000/svg">
                    <use href="#heart-shape" />
                </svg>
            </div>
            <div class="message-container">
                <div class="message"></div>
            </div>
        </div>
        <div class="particles-container"></div>
        <div class="small-hearts-container"></div>
        <div class="tap-layer" aria-hidden="true"></div>
        <div class="greeting" aria-live="polite"></div>
        <div class="hint-container">
            <div class="hint">點擊匯聚愛心 ❤️</div>
        </div>

        <div class="timeline-backdrop" aria-hidden="true"></div>
        <div class="timeline-scroller">
            <div class="timeline-container">
                <div class="timeline-line"></div>
                <div class="timeline-points"></div>
            </div>
            <button type="button" class="timeline-continue">我們的故事，未完待續 →</button>
        </div>

        <div class="info-modal">
            <div class="info-content" role="dialog" aria-modal="true" aria-labelledby="info-title">
                <div class="modal-confetti" aria-hidden="true"></div>
                <button type="button" class="info-close" aria-label="關閉">×</button>
                <div class="info-image-container">
                    <img alt="紀念照片" class="info-image" decoding="async">
                </div>
                <div class="info-details">
                    <h3 class="info-title" id="info-title"></h3>
                    <p class="info-date"></p>
                    <p class="info-description"></p>
                </div>
                <div class="info-nav">
                    <button type="button" class="info-prev" aria-label="上一個回憶">‹</button>
                    <span class="info-counter" aria-live="polite"></span>
                    <button type="button" class="info-next" aria-label="下一個回憶">›</button>
                </div>
            </div>
        </div>

        <div class="timer-container">
            <div class="timer-content">
                <div class="timer-title"></div>
                <div class="timer-display">
                    <div class="timer-unit">
                        <span class="timer-value" id="t-days"></span>
                        <span class="timer-label">天</span>
                    </div>
                    <div class="timer-separator">:</div>
                    <div class="timer-unit">
                        <span class="timer-value" id="t-hours"></span>
                        <span class="timer-label">時</span>
                    </div>
                    <div class="timer-separator">:</div>
                    <div class="timer-unit">
                        <span class="timer-value" id="t-minutes"></span>
                        <span class="timer-label">分</span>
                    </div>
                    <div class="timer-separator">:</div>
                    <div class="timer-unit">
                        <span class="timer-value" id="t-seconds"></span>
                        <span class="timer-label">秒</span>
                    </div>
                </div>
                <ul class="timer-upcoming" aria-label="接下來的紀念日"></ul>
                <div class="timer-message"></div>
                <div class="timer-reply-wrap">
                    <button type="button" class="timer-reply"></button>
                    <p class="timer-reply-count" aria-live="polite"></p>
                </div>
                <button type="button" class="timer-restart">重新開始</button>
            </div>
        </div>
    </div>
    <!-- Outside .container: the firework camera moves the whole scene. -->
    <canvas class="firework-canvas" aria-hidden="true"></canvas>
    <div class="firework-message" role="status"></div>
    <form class="gate" hidden autocomplete="off">
        <svg class="gate-heart" viewBox="0 0 32 29.6" aria-hidden="true">
            <use href="#heart-shape" />
        </svg>
        <label class="gate-title" for="gate-input"></label>
        <input class="gate-input" id="gate-input" inputmode="numeric" enterkeyhint="go" maxlength="10">
        <button type="submit" class="gate-submit"></button>
        <p class="gate-error" aria-live="assertive"></p>
    </form>
    <script src="vendor/gsap.min.js"></script>
    <script src="ambient.js"></script>
    <script src="firework.js"></script>
    <script src="content.js"></script>
    <script src="script.js"></script>
</body>

</html>
